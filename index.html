    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlowTask - Digital Posters</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .poster {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 16px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .poster h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .poster p.tagline {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 30px;
    }

    .features {
      text-align: left;
      margin-bottom: 30px;
    }

    .features li {
      margin-bottom: 12px;
      font-size: 18px;
    }

    .cta-button {
      display: inline-block;
      padding: 14px 28px;
      background-color: #ffffff;
      color: #764ba2;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      background-color: #f2f2f2;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="poster">
    <h1>FlowTask</h1>
    <p class="tagline">Organize. Prioritize. Achieve More.</p>
    
    <ul class="features">
      <li>✅ Plan and track your tasks effortlessly</li>
      <li>📅 Built-in calendar and reminders</li>
      <li>🤝 Collaborate with your team in real-time</li>
      <li>📊 Visualize progress with charts</li>
      <li>🔒 Secure and cloud-based</li>
    </ul>
    
    <a href="#" class="cta-button">Get Started Free</a>

    <div class="footer">
      © 2025 FlowTask Inc.
    </div>
  </div>
</body>

</html>
